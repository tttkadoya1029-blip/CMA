<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f4">
<title>CMA正誤トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#f3f5f4; --sheet:#ffffff; --ink:#18242b; --ink-2:#4d5d66; --rule:#d5dddc;
  --accent:#1f6f6a; --accent-ink:#ffffff; --accent-soft:#e1efed;
  --maru:#1d5fbf; --maru-soft:#e4edfa; --batsu:#c2362f; --batsu-soft:#fbe7e5;
  --warn:#a86a00; --warn-soft:#fbf0d9; --gold:#a07a12; --gold-soft:#f7efd6;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#11181b; --sheet:#182226; --ink:#e4ecec; --ink-2:#9aaab0; --rule:#2b3a3f;
  --accent:#4fb3a9; --accent-ink:#0c1a1a; --accent-soft:#1c3633;
  --maru:#7aa9f0; --maru-soft:#1b2a40; --batsu:#f07a72; --batsu-soft:#3a1f1d;
  --warn:#e2b04a; --warn-soft:#3a2f17; --gold:#e2c25a; --gold-soft:#3a3218; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.wrap{max-width:860px;margin:0 auto;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.brand b{font-size:20px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;flex:none}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:22px;font-weight:900} h2{font-size:18px;font-weight:700}
h3{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em}
p{margin:0}
.muted{color:var(--ink-2);font-size:13px}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:12px 18px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:13px;min-height:36px}
.btn.google{background:var(--sheet);color:var(--ink);border-color:var(--rule);width:100%}
.btn.video{background:var(--batsu-soft);border-color:transparent;color:var(--batsu)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tab:focus-visible,.mark:focus-visible,input:focus-visible,select:focus-visible,.linkbtn:focus-visible,.li.click:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
/* iOSは16px未満の入力欄でズームするため16px */
input[type=text],input[type=email],input[type=password],input[type=url],select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.auth{max-width:440px;width:100%;margin:0 auto}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--rule)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
/* モード選択 */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.mode{border:1px solid var(--rule);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mode h2{display:flex;align-items:center;gap:8px}
.mode .btn{margin-top:auto}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em;white-space:nowrap}
.pill.p{background:var(--accent-soft);color:var(--accent)} .pill.e{background:var(--gold-soft);color:var(--gold)}
/* 出題 */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:nowrap;font-size:13px;color:var(--ink-2)}
.qmeta .l{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.qno{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stem{font-size:18px;line-height:1.85;font-weight:500}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mark{font:inherit;border:2px solid var(--rule);background:var(--sheet);border-radius:10px;padding:16px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mark .sym{font-size:44px;line-height:1;font-weight:900}
.mark .lb{font-size:13px;color:var(--ink-2)}
@media (hover:hover){.mark.m:hover:not(:disabled){border-color:var(--maru);background:var(--maru-soft)}.mark.b:hover:not(:disabled){border-color:var(--batsu);background:var(--batsu-soft)}}
.mark.m .sym{color:var(--maru)} .mark.b .sym{color:var(--batsu)}
.mark.chosen{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.mark:disabled{cursor:default}
.verdict{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.verdict.ok{background:var(--maru-soft)} .verdict.ng{background:var(--batsu-soft)}
.verdict b.v{font-size:16px} .verdict.ok b.v{color:var(--maru)} .verdict.ng b.v{color:var(--batsu)}
.others{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);border-top:1px dashed var(--rule);padding-top:8px}
.others b{font-family:var(--f-mono);color:var(--ink)}
/* 縦に積むリスト（スマホでも崩れない） */
.list{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--rule);align-items:start;min-width:0}
.li:last-child{border-bottom:0}
.li .mk{font-size:20px;font-weight:900;line-height:1.3;min-width:24px;text-align:center}
.li .mk.ok{color:var(--maru)} .li .mk.ng{color:var(--batsu)}
.li .body{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.li .side{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.li .actions{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap}
.li.me{background:var(--accent-soft)}
.li.click{cursor:pointer}
@media (hover:hover){.li.click:hover{background:var(--accent-soft)}}
.kv{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.kv b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.rank{font-family:var(--f-mono);font-weight:600;font-size:18px;min-width:32px;text-align:center}
.rank.r1{color:var(--gold)}
/* 表（講師用。横スクロール） */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--ink-2);font-weight:700;background:var(--paper);position:sticky;top:0}
td.num,th.num{text-align:right;font-family:var(--f-mono)}
tbody tr:last-child td{border-bottom:0}
td.long{white-space:normal;min-width:220px}
th.first,td.first{position:sticky;left:0;background:var(--sheet);z-index:1}
th.first{background:var(--paper)}
.bar-cell{display:flex;align-items:center;gap:8px}
.minibar{flex:0 0 64px;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr}}
.stat{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;min-width:0}
.stat .k{font-size:12px;color:var(--ink-2)}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .v small{font-size:12px;color:var(--ink-2);font-weight:400}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.tag.red{background:var(--batsu-soft);color:var(--batsu)} .tag.amber{background:var(--warn-soft);color:var(--warn)}
.tag.blue{background:var(--maru-soft);color:var(--maru)} .tag.green{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.empty{text-align:center;padding:24px 12px;color:var(--ink-2)}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.switch input{width:18px;height:18px}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:14px;padding:10px 8px;border:0;background:var(--sheet);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.vid-row{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.vid-row:last-child{border-bottom:0}
.vid-row .in{display:flex;gap:8px}
.vid-row .st{font-size:12px;color:var(--ink-2);min-height:1em}
details summary{cursor:pointer;color:var(--ink-2);font-size:13px}
@media (max-width:480px){.sheet{padding:16px}.stem{font-size:17px}.mark .sym{font-size:40px}h1{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><b>CMA正誤トレーナー</b><span>証券アナリスト第1次 科目Ⅰ</span></div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-view="home" aria-pressed="true">解く</button>
    <button class="tab" data-view="ranking" aria-pressed="false">ランキング</button>
    <button class="tab" data-view="teacher" aria-pressed="false" hidden>講師用 分析</button>
  </nav>
  <main id="app"><section class="sheet"><h2>読み込んでいます…</h2></section></main>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CFG=window.APP_CONFIG||{};
const OUTLIER_MS=300000; // 5分超は離席とみなし時間の集計から除外
const SLOW_MS=45000;     // 全体データが少ないときの「時間がかかった」目安
const S={sb:null,session:null,profile:null,questions:[],QMAP:{},points:{},myAttempts:[],qstats:{},pstats:{},
  view:"home",quiz:null,lastResult:null,sample:false,student:null,error:"",teacherData:null,teacherLoading:false,
  authMode:"login",authMsg:"",practicePoint:"",rankTab:"exam",ranking:null};
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sec=ms=>ms==null||isNaN(ms)?"—":(ms/1000).toFixed(1)+"秒";
const pct=x=>x==null||isNaN(x)?"—":Math.round(x*100)+"%";
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const sd=a=>{const m=mean(a);if(a.length<2)return 0;return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)};
const medT=list=>median(list.filter(a=>a.ms<=OUTLIER_MS).map(a=>a.ms)); // 解答時間はすべて中央値
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtDate=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const isTeacher=()=>S.profile?.role==="teacher";
const pointOf=qid=>S.QMAP[qid]?.point_code||"";
const plabel=code=>code?`${code} ${S.points[code]?.title||""}`:"未分類";
const safeUrl=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch{return null}};
const videoBtn=(code,label)=>{const u=safeUrl(S.points[code]?.video_url||"");return u?`<a class="btn video small" href="${esc(u)}" target="_blank" rel="noopener">▶ ${esc(label||"解説動画")}</a>`:""};

/* ===== 起動 ===== */
(async function boot(){
  if(!CFG.SUPABASE_URL||CFG.SUPABASE_URL.includes("xxxx")||!window.supabase){
    app.innerHTML=`<section class="sheet"><h2>初期設定がまだです</h2><p>config.js に Supabase の URL と anon key を貼り付けてから、もう一度開いてください。手順は README.md にあります。</p></section>`;return;
  }
  S.sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const {data}=await S.sb.auth.getSession();
  await onAuth(data.session);
  S.sb.auth.onAuthStateChange((_e,session)=>{ if((session?.user?.id)!==(S.session?.user?.id)) onAuth(session) });
})();

async function onAuth(session){
  Object.assign(S,{session,profile:null,teacherData:null,quiz:null,lastResult:null,ranking:null,view:"home"});
  if(!session){$("#tabs").hidden=true;renderWho();renderAuth();return}
  app.innerHTML=`<section class="sheet"><h2>読み込んでいます…</h2></section>`;
  const uid=session.user.id;
  const [p,q,pts]=await Promise.all([
    S.sb.from("profiles").select("*").eq("id",uid).maybeSingle(),
    S.sb.rpc("get_questions"),
    S.sb.from("points").select("*").order("sort")
  ]);
  const err=p.error||q.error||pts.error;
  if(err){app.innerHTML=`<section class="sheet"><h2>データを読み込めませんでした</h2><p class="muted">${esc(err.message)}</p><p class="muted">データベースの更新（schema.sql の再実行）が済んでいるか確認してください。</p></section>`;return}
  S.profile=p.data||{id:uid,email:session.user.email,display_name:"",role:"student",show_in_ranking:true};
  S.points=Object.fromEntries(pts.data.map(x=>[x.code,x]));
  S.questions=q.data;S.QMAP=Object.fromEntries(q.data.map(x=>[x.id,x]));
  await Promise.all([loadMine(),loadStats()]);
  $("#tabs").hidden=false;
  document.querySelector('.tab[data-view="teacher"]').hidden=!isTeacher();
  setTab("home");render();
}
const usedPoints=()=>[...new Set(S.questions.map(q=>q.point_code))].sort();
async function loadMine(){
  const rows=await fetchAll(()=>S.sb.from("attempts").select("session_id,question_id,choice,is_correct,time_ms,answered_at,sessions(mode)").eq("user_id",S.session.user.id).order("answered_at"));
  S.myAttempts=rows.map(toAns);
}
async function loadStats(){
  const [qs,ps]=await Promise.all([S.sb.rpc("get_question_stats"),S.sb.rpc("get_point_stats")]);
  S.qstats=Object.fromEntries((qs.data||[]).map(r=>[r.question_id,{n:+r.n,acc:+r.accuracy,med:r.median_ms==null?null:+r.median_ms}]));
  S.pstats=Object.fromEntries((ps.data||[]).map(r=>[r.point_code,{n:+r.n,acc:+r.accuracy,med:r.median_ms==null?null:+r.median_ms}]));
}
const toAns=r=>({sid:r.session_id,qid:r.question_id,choice:r.choice,correct:r.is_correct,ms:r.time_ms,at:new Date(r.answered_at).getTime(),uid:r.user_id,mode:r.sessions?.mode||"practice"});
async function fetchAll(build){ // 1回1000件の上限を超えても全件取得
  const out=[];const step=1000;
  for(let from=0;;from+=step){const {data,error}=await build().range(from,from+step-1);if(error)throw error;out.push(...data);if(data.length<step)break}
  return out;
}

/* ===== ログイン ===== */
function renderAuth(){
  const signup=S.authMode==="signup";
  app.innerHTML=`<section class="sheet auth">
    <h1>${signup?"新規登録":"ログイン"}</h1>
    <p class="muted">解答時間と正誤をあなたのアカウントに記録し、苦手な論点を分析します。</p>
    ${S.authMsg?`<div class="note ${S.authMsg.startsWith("✓")?"info":""}">${esc(S.authMsg.replace(/^✓/,""))}</div>`:""}
    ${CFG.ENABLE_GOOGLE!==false?`<button class="btn google" id="g"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.4 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Googleアカウントで続ける</button>
    <div class="divider">またはメールアドレスで</div>`:""}
    <form id="ef" style="display:flex;flex-direction:column;gap:12px">
      ${signup?`<label class="f">お名前（ランキング・講師の画面に表示）<input type="text" id="nm" maxlength="30" required autocomplete="name"></label>`:""}
      <label class="f">メールアドレス<input type="email" id="em" required autocomplete="email" inputmode="email"></label>
      <label class="f">パスワード（6文字以上）<input type="password" id="pw" minlength="6" required autocomplete="${signup?"new-password":"current-password"}"></label>
      <button class="btn accent" type="submit" id="esub">${signup?"登録する":"ログイン"}</button>
    </form>

function authErr(e){

/* ===== 判定 ===== */
function diagnose(ac,tm,slow){
  if(ac==null)return null;const isSlow=tm!=null&&tm>slow;
  if(ac<0.6&&isSlow)return {c:"red",l:"理解不足",h:"時間をかけても正解できない。基礎概念から復習"};
  if(ac<0.6)return {c:"amber",l:"早とちり",h:"速いが誤答が多い。問題文の読み方・ひっかけの型を確認"};
  if(isSlow)return {c:"blue",l:"定着不足",h:"正解できるが遅い。反復演習でスピードを上げる"};
  return {c:"green",l:"安定",h:"正確で速い。応用問題へ"};
}
const slowLine=code=>{const m=S.pstats[code]?.med;return m&&S.pstats[code].n>=5?m*1.2:SLOW_MS};
const tagHtml=d=>d?`<span class="tag ${d.c}" title="${esc(d.h)}">${d.l}</span>`:"—";
const accBar=x=>`<div class="bar-cell"><span class="minibar"><i style="width:${Math.round((x||0)*100)}%"></i></span><span style="font-family:var(--f-mono)">${pct(x)}</span></div>`;
function myPointRows(ans){
  return usedPoints().map(code=>{const a=ans.filter(x=>pointOf(x.qid)===code);if(!a.length)return null;
    const ac=a.filter(x=>x.correct).length/a.length,tm=medT(a);
    return {code,n:a.length,ac,tm,d:diagnose(ac,tm,slowLine(code)),all:S.pstats[code]}}).filter(Boolean);
}

/* ===== 出題 ===== */
let tick=null;
async function startQuiz(mode,point){
  document.querySelectorAll("#startP,#startE").forEach(b=>b.disabled=true);
  const pool=S.questions.filter(q=>mode==="exam"||!point||q.point_code===point);
  const {data,error}=await S.sb.from("sessions").insert({user_id:S.session.user.id,mode,question_count:pool.length}).select("id").single();
  if(error){S.error="開始できませんでした："+error.message;render();return}
  S.quiz={sid:data.id,mode,order:shuffle(pool.map(q=>q.id)),i:0,answers:[],answered:false,done:false,paused:0,hiddenAt:null,t0:0,inflight:[]};
  S.lastResult=null;S.error="";showQuestion();window.scrollTo(0,0);
}
function showQuestion(){
  const q=S.quiz;q.answered=false;q.paused=0;q.hiddenAt=null;q.choice=null;
  renderQuiz();q.t0=performance.now();clearInterval(tick);
  tick=setInterval(()=>{const el=$("#tm");if(el&&!q.answered)el.textContent=fmtT(elapsed())},100);
}
function elapsed(){const q=S.quiz;let p=q.paused;if(q.hiddenAt)p+=performance.now()-q.hiddenAt;return Math.max(0,performance.now()-q.t0-p)}
const fmtT=ms=>{const s=ms/1000;return s<60?s.toFixed(1):Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")};
function renderQuiz(){
  const q=S.quiz,item=S.QMAP[q.order[q.i]],last=q.answers[q.i],exam=q.mode==="exam";
  const st=S.qstats[item.id];
  app.innerHTML=`<section class="sheet">
    <div class="qmeta"><span class="l"><span class="pill ${exam?"e":"p"}">${exam?"試験":"練習"}</span><span class="qno">${q.i+1} / ${q.order.length}</span></span>
      <span class="timer" id="tm" aria-label="経過時間">${q.answered?fmtT(q.lastMs):"0.0"}</span></div>
    <div><span class="chip">${esc(plabel(item.point_code))}</span></div>
    <div class="progress"><i style="width:${(q.i/q.order.length)*100}%"></i></div>
    <p class="stem">${esc(item.stem)}</p>
    <div class="marks">
      <button class="mark m ${q.choice===true?"chosen":""}" id="ans-true" ${q.answered?"disabled":""}><span class="sym">○</span><span class="lb">正しい</span></button>
      <button class="mark b ${q.choice===false?"chosen":""}" id="ans-false" ${q.answered?"disabled":""}><span class="sym">×</span><span class="lb">誤り</span></button>
    </div>
    ${!q.answered?`<p class="muted">${exam?"試験モードでは正誤は最後にまとめて表示します。":"根拠を持って選んでください。"}</p>`
      :exam?(S.error?`<div class="note">${esc(S.error)}</div><div class="row end"><button class="btn" id="retry">もう一度送信</button></div>`:`<p class="muted">記録しています…</p>`)
      :last?`<div class="verdict ${last.correct?"ok":"ng"}"><b class="v">${last.correct?"正解":"不正解"}（正答：${last.answer?"○":"×"}）</b><p>${esc(last.exp)}</p>
        <div class="others"><span>みんなの正答率 <b>${pct(st?.acc)}</b></span><span>みんなの時間 <b>${sec(st?.med)}</b></span><span>${st?.n||0}件の解答</span></div>
        ${!last.correct?`<div class="row">${videoBtn(item.point_code,plabel(item.point_code)+" の解説動画")}</div>`:""}</div>
        <div class="row end"><button class="btn" id="next">${q.i+1<q.order.length?"次の問題へ":"結果を見る"}</button></div>`
      :(S.error?`<div class="note">${esc(S.error)}</div><div class="row end"><button class="btn" id="retry">もう一度送信</button></div>`:`<p class="muted">採点しています…</p>`)}
  </section>`;
  if(!q.answered){$("#ans-true").addEventListener("click",()=>answer(true));$("#ans-false").addEventListener("click",()=>answer(false))}
  else if(last&&!exam){$("#next").addEventListener("click",next)}
  $("#retry")?.addEventListener("click",()=>send(q.i));
}
function answer(v){
  const q=S.quiz;if(q.answered)return;
  q.lastMs=Math.round(elapsed());q.answered=true;q.choice=v;clearInterval(tick);
  q.answers[q.i]=null;q.pending={i:q.i,qid:q.order[q.i],choice:v,ms:q.lastMs};
  q.sendData=q.sendData||{};q.sendData[q.i]=q.pending;
  send(q.i);
}
async function send(i){
  const q=S.quiz,d=q.sendData[i];S.error="";renderQuiz();
  const {data,error}=await S.sb.rpc("submit_answer",{p_session:q.sid,p_question:d.qid,p_choice:d.choice,p_time_ms:d.ms});
  if(S.quiz!==q)return;
  if(error||!data?.length){S.error="解答を保存できませんでした。通信状況を確認してください。"+(error?"（"+error.message+"）":"");renderQuiz();return}
  const r=data[0];
  q.answers[i]={qid:d.qid,choice:d.choice,correct:r.is_correct,answer:r.answer,exp:r.explanation,ms:d.ms};
  if(q.mode==="exam")next();else renderQuiz();
}
async function next(){
  const q=S.quiz;
  if(q.i+1<q.order.length){q.i++;showQuestion();window.scrollTo(0,0);return}
  q.done=true;
  await S.sb.from("sessions").update({finished_at:new Date().toISOString()}).eq("id",q.sid);
  S.lastResult={answers:q.answers,mode:q.mode,rank:null};S.quiz=null;
  app.innerHTML=`<section class="sheet"><h2>集計しています…</h2></section>`;
  await Promise.all([loadMine(),loadStats()]);S.teacherData=null;S.ranking=null;
  if(q.mode==="exam"){const {data}=await S.sb.rpc("get_exam_ranking");const me=(data||[]).find(r=>r.is_me);S.lastResult.rank=me?{rank:+me.rank,total:data.length,best:me}:null}
  setTab("home");render();window.scrollTo(0,0);
}

    </div>
    <div class="row"><button class="btn ghost" id="home">記録を見る</button>${R.mode==="exam"?`<button class="btn ghost" id="rk">ランキングを見る</button>`:""}<button class="btn accent" id="again">もう一度</button></div>

  ${wrongPts.length?`<section class="sheet"><h2>見直す論点</h2>
    <div class="list">${wrongPts.map(c=>`<div class="li"><span class="mk ng">×</span><div class="body"><b>${esc(plabel(c))}</b><span class="muted">${esc(S.points[c]?.description||"")}</span></div><span></span>

  <section class="sheet"><h2>問題ごとの結果</h2>
    <div class="list">${a.map((x,i)=>{const q=S.QMAP[x.qid],st=S.qstats[x.qid];return `<div class="li"><span class="mk ${x.correct?"ok":"ng"}">${x.correct?"○":"×"}</span>
      <div class="body"><span class="muted">第${i+1}問・${esc(plabel(q.point_code))}</span><span>${esc(q.stem)}</span>
        <details><summary>正答 ${x.answer?"○":"×"}／あなた ${x.choice?"○":"×"}　解説を見る</summary><p class="muted" style="margin-top:4px">${esc(x.exp)}</p></details>
        <div class="kv"><span>みんなの正答率 <b>${pct(st?.acc)}</b></span><span>みんなの時間 <b>${sec(st?.med)}</b></span></div></div>
      <span class="side">${sec(x.ms)}</span>
      ${!x.correct&&safeUrl(S.points[q.point_code]?.video_url||"")?`<div class="actions">${videoBtn(q.point_code)}</div>`:""}</div>`}).join("")}</div>
  </section>`;
  $("#home").addEventListener("click",()=>{S.lastResult=null;render();window.scrollTo(0,0)});
  $("#rk")?.addEventListener("click",()=>{S.lastResult=null;S.rankTab="exam";setTab("ranking");render();window.scrollTo(0,0)});

            :`<div class="kv"><span><b>${r.answers}</b>問</span><span><b>${r.sessions}</b>回</span></div>`}</div>
      <span class="side">${exam?pct(r.correct/r.total):""}</span></div>`).join("")}</div>`
    :`<div class="empty">${exam?"まだ試験モードの記録がありません。最初の1人になりましょう。":"直近30日の記録がありません。"}</div>`}
    <label class="switch"><input type="checkbox" id="show" ${S.profile.show_in_ranking!==false?"checked":""}> ランキングに自分の名前を表示する</label>
    <p class="muted">オフにすると、他の人のランキングにあなたは表示されません（自分の順位は見られます）。</p>
  </section>`;
  document.querySelectorAll("[data-rt]").forEach(b=>b.addEventListener("click",()=>{S.rankTab=b.dataset.rt;render()}));
  $("#show").addEventListener("change",async e=>{
    const v=e.target.checked;e.target.disabled=true;
    const {error}=await S.sb.from("profiles").update({show_in_ranking:v}).eq("id",S.session.user.id);
    if(!error)S.profile.show_in_ranking=v;
    S.ranking=null;render();
  });
}

/* ===== 講師：分析 ===== */
async function loadTeacher(){
  if(S.teacherLoading)return;S.teacherLoading=true;
  try{
    const [profiles,attempts,qs]=await Promise.all([
      fetchAll(()=>S.sb.from("profiles").select("id,display_name,email,role").order("created_at")),
      fetchAll(()=>S.sb.from("attempts").select("user_id,session_id,question_id,choice,is_correct,time_ms,answered_at,sessions(mode)").order("id")),
      S.sb.from("questions").select("*").order("sort")
    ]);
    S.teacherData={profiles,attempts:attempts.map(toAns),questions:qs.data||[]};S.error="";
  }catch(e){S.error="分析データを読み込めませんでした："+e.message}
  S.teacherLoading=false;if(S.view==="teacher")render();
}
function sampleStudents(){ // 画面確認用の架空データ。保存はしない
  const names=["サンプルA","サンプルB","サンプルC","サンプルD","サンプルE","サンプルF"],skill=[.9,.75,.6,.5,.8,.4],speed=[18,30,25,40,55,15];
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  return names.map((n,k)=>{const ans=[];for(let s=0;s<2;s++)S.questions.forEach((q,j)=>{const p=Math.min(.98,skill[k]*(1-j*.05)+.15);
    ans.push({sid:"x"+s,qid:q.id,correct:rnd()<p,ms:Math.round((speed[k]+rnd()*20)*(q.level==="応用"?1.6:1)*1000)})});
    return {uid:"sample"+k,name:n,ans}});
}
function teacherModel(students){
  students=students.filter(s=>s.ans.length);
  const P=usedPoints(),all=students.flatMap(s=>s.ans.map(a=>({...a,uid:s.uid})));
  const pMed={};P.forEach(c=>{pMed[c]=medT(all.filter(a=>pointOf(a.qid)===c))});
  students.forEach(s=>{
    s.sessions=new Set(s.ans.map(a=>a.sid)).size;
    s.acc=s.ans.filter(a=>a.correct).length/s.ans.length;s.t=medT(s.ans);
    s.points=P.map(c=>{const a=s.ans.filter(x=>pointOf(x.qid)===c);if(!a.length)return {code:c,n:0};
      const ac=a.filter(x=>x.correct).length/a.length,tm=medT(a);
      return {code:c,n:a.length,ac,tm,d:diagnose(ac,tm,(pMed[c]||SLOW_MS)*1.2)}});
  });
  const accs=students.map(s=>s.acc),m=mean(accs),d=sd(accs);
  students.forEach(s=>{s.dev=d>0?50+10*(s.acc-m)/d:50;const w=s.points.filter(x=>x.n).sort((a,b)=>a.ac-b.ac||((b.tm||0)-(a.tm||0)))[0];s.weak=w&&w.ac<1?w:null});
  students.sort((a,b)=>b.dev-a.dev);
  const points=P.map(c=>{const a=all.filter(x=>pointOf(x.qid)===c);return {code:c,n:a.length,ac:a.length?a.filter(x=>x.correct).length/a.length:null,tm:pMed[c]}});
  const questions=S.questions.map(q=>{const a=all.filter(x=>x.qid===q.id);return {q,n:a.length,ac:a.length?a.filter(x=>x.correct).length/a.length:null,tm:medT(a),out:a.filter(x=>x.ms>OUTLIER_MS).length}});
  return {students,points,questions,all,classAcc:m};
}
function renderTeacher(){
  if(!S.teacherData&&!S.sample){
    app.innerHTML=`<section class="sheet"><h1>講師用 分析</h1>${S.error?`<div class="note">${esc(S.error)}</div><div class="row"><button class="btn" id="rl">再読み込み</button></div>`:`<p class="muted">集計しています…</p>`}</section>`;
    $("#rl")?.addEventListener("click",()=>{S.error="";loadTeacher()});if(!S.error)loadTeacher();return;
  }
  const TD=S.teacherData;let students;
  if(S.sample)students=sampleStudents();
  else{const by={};TD.attempts.forEach(a=>{(by[a.uid]=by[a.uid]||[]).push(a)});
    students=TD.profiles.map(p=>({uid:p.id,name:p.display_name||p.email||"名前未登録",ans:by[p.id]||[]}));}
  const M=teacherModel(students),answerOf=id=>TD?.questions.find(x=>x.id===id)?.answer;
  if(S.student){const st=M.students.find(s=>s.uid===S.student);if(st){renderStudent(st,M);return}S.student=null}
  const has=M.students.length>0;
  app.innerHTML=`<section class="sheet">
    <div class="row between"><h1>講師用 分析</h1><button class="btn ghost small" id="rl">最新にする</button></div>
    <label class="switch"><input type="checkbox" id="smp" ${S.sample?"checked":""}> サンプルデータで表示</label>
    ${S.sample?`<div class="note">サンプル表示中です。架空の6名分のデータで、実際の記録ではありません。</div>`:`<p class="muted">登録者 ${TD.profiles.length} 名</p>`}
    ${has?`<div class="stats">
      <div class="stat"><div class="k">解答した人</div><div class="v">${M.students.length}<small> 名</small></div></div>
      <div class="stat"><div class="k">総解答数</div><div class="v">${M.all.length}</div></div>
      <div class="stat"><div class="k">全体正答率</div><div class="v">${pct(M.all.filter(a=>a.correct).length/M.all.length)}</div></div>
      <div class="stat"><div class="k">時間（中央値）</div><div class="v">${(((medT(M.all))||0)/1000).toFixed(1)}<small> 秒</small></div></div></div>`
    :`<div class="empty">まだ解答の記録がありません。このサイトのURLを受講者に送り、ログインして解いてもらうとここに集計されます。</div>`}
  </section>
  ${has?`<section class="sheet"><h2>受講者一覧</h2>
    <p class="muted">偏差値は全員の正答率から算出（50＋10×（本人−平均）÷標準偏差）。時間は中央値。押すと個別の分析を表示します。</p>
    <div class="list">${M.students.map(s=>`<div class="li click" tabindex="0" data-uid="${esc(s.uid)}"><span class="rank">${s.dev.toFixed(0)}</span>
      <div class="body"><b>${esc(s.name)}</b><div class="kv"><span>正答率 <b>${pct(s.acc)}</b></span><span>時間 <b>${sec(s.t)}</b></span><span><b>${s.ans.length}</b>問・${s.sessions}回</span></div>
      ${s.weak?`<span class="muted">弱点：${esc(plabel(s.weak.code))} ${tagHtml(s.weak.d)}</span>`:""}</div><span class="side">偏差値</span></div>`).join("")}</div></section>
  <section class="sheet"><h2>学習ポイント × 受講者</h2>
    <div class="legend"><span>${tagHtml({c:"red",l:"理解不足",h:""})} 遅く誤答が多い</span><span>${tagHtml({c:"amber",l:"早とちり",h:""})} 速いが誤答が多い</span><span>${tagHtml({c:"blue",l:"定着不足",h:""})} 正解だが遅い</span><span>${tagHtml({c:"green",l:"安定",h:""})}</span></div>
    <p class="muted">誤答が多い＝正答率60%未満。遅い＝その学習ポイントの全体中央値の1.2倍超。表は横にスクロールできます。</p>
    <div class="tbl"><table><thead><tr><th class="first">受講者</th>${M.points.map(p=>`<th title="${esc(S.points[p.code]?.title||"")}">${esc(p.code)}<br><span style="font-weight:400">${esc(S.points[p.code]?.title||"")}</span></th>`).join("")}</tr></thead>
    <tbody>${M.students.map(s=>`<tr><td class="first">${esc(s.name)}</td>${s.points.map(x=>`<td>${x.n?`${tagHtml(x.d)}<br><span class="muted">${pct(x.ac)}・${sec(x.tm)}</span>`:"—"}</td>`).join("")}</tr>`).join("")}
    <tr><td class="first"><b>全体</b></td>${M.points.map(x=>`<td><span class="muted">${pct(x.ac)}・${sec(x.tm)}</span></td>`).join("")}</tr></tbody></table></div></section>
  <section class="sheet"><h2>問題別</h2>
    <p class="muted">正答率が低い順。時間は中央値で、5分超（離席とみなす）は除外。</p>
    <div class="list">${[...M.questions].sort((a,b)=>(a.ac??2)-(b.ac??2)).map(x=>{const ans=answerOf(x.q.id);return `<div class="li"><span class="mk" style="font-size:13px;font-family:var(--f-mono)">${esc(x.q.id.toUpperCase())}</span>
      <div class="body"><span class="muted">${esc(plabel(x.q.point_code))}${ans==null?"":`・正答 ${ans?"○":"×"}`}</span><span>${esc(x.q.stem)}</span>
      <div class="kv"><span>正答率 <b>${pct(x.ac)}</b></span><span>時間 <b>${sec(x.tm)}</b></span><span><b>${x.n}</b>件${x.out?`（除外${x.out}）`:""}</span></div></div><span></span></div>`}).join("")}</div></section>`:""}
  <section class="sheet"><h2>解説動画のリンク</h2>
    <p class="muted">学習ポイントごとにYouTubeなどのURLを登録すると、受講者が間違えた問題・弱い論点から直接動画に飛べます。入力欄から離れると保存されます。</p>
    <div class="list">${Object.values(S.points).map(p=>`<div class="vid-row"><b>${esc(p.code)} ${esc(p.title)}</b>
      <div class="in"><input type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." data-code="${esc(p.code)}" id="v-${esc(p.code)}" value="${esc(p.video_url||"")}"></div>
      <span class="st" id="vs-${esc(p.code)}">${S.questions.some(q=>q.point_code===p.code)?"":"（この学習ポイントの問題はまだありません）"}</span></div>`).join("")}</div>
  </section>`;
  $("#smp").addEventListener("change",e=>{S.sample=e.target.checked;render()});
  $("#rl").addEventListener("click",async()=>{S.teacherData=null;S.sample=false;await loadStats();render()});
  document.querySelectorAll(".li.click").forEach(r=>{const go=()=>{S.student=r.dataset.uid;render();window.scrollTo(0,0)};r.addEventListener("click",go);r.addEventListener("keydown",e=>{if(e.key==="Enter")go()})});
  document.querySelectorAll("input[data-code]").forEach(inp=>inp.addEventListener("change",async()=>{
    const code=inp.dataset.code,v=inp.value.trim(),st=$("#vs-"+code);
    if(v&&!safeUrl(v)){st.textContent="https:// から始まるURLを入力してください。";return}
    st.textContent="保存しています…";
    const {error}=await S.sb.from("points").update({video_url:v||null}).eq("code",code);
    if(error){st.textContent="保存できませんでした："+error.message;return}
    S.points[code].video_url=v||null;st.textContent=v?"保存しました。":"リンクを削除しました。";
  }));
}
function renderStudent(s,M){
  const qrows=S.questions.map(q=>{const a=s.ans.filter(x=>x.qid===q.id);return {q,n:a.length,miss:a.filter(x=>!x.correct).length,tm:medT(a)}}).filter(x=>x.n).sort((a,b)=>b.miss/b.n-a.miss/a.n||(b.tm||0)-(a.tm||0));
  const rank={red:0,amber:1,blue:2};
  const plan=s.points.filter(x=>x.n&&x.d&&x.d.c!=="green").sort((a,b)=>rank[a.d.c]-rank[b.d.c]);
  app.innerHTML=`<section class="sheet">
    <div class="row"><button class="btn ghost small" id="back">← 一覧へ戻る</button></div>
    <h1>${esc(s.name)} さんの分析</h1>
    ${S.sample?`<div class="note">サンプル表示中（架空のデータ）</div>`:""}
    <div class="stats">
      <div class="stat"><div class="k">偏差値</div><div class="v">${s.dev.toFixed(1)}</div></div>
      <div class="stat"><div class="k">正答率（全体）</div><div class="v">${pct(s.acc)}<small> ${pct(M.classAcc)}</small></div></div>
      <div class="stat"><div class="k">時間（中央値）</div><div class="v">${s.t?(s.t/1000).toFixed(1):"—"}<small> 秒</small></div></div>
      <div class="stat"><div class="k">解答数</div><div class="v">${s.ans.length}<small> 問</small></div></div></div></section>
  <section class="sheet"><h2>指導の優先順位</h2>
    ${plan.length?`<div class="list">${plan.map((x,i)=>`<div class="li"><span class="rank">${i+1}</span><div class="body"><b>${esc(plabel(x.code))}</b> <span>${tagHtml(x.d)}</span><span class="muted">${esc(x.d.h)}</span></div><span class="side">${pct(x.ac)}<br>${sec(x.tm)}</span>
      ${safeUrl(S.points[x.code]?.video_url||"")?`<div class="actions">${videoBtn(x.code)}</div>`:""}</div>`).join("")}</div>`
    :`<p>どの学習ポイントも安定しています。応用レベルの問題を増やす段階です。</p>`}</section>
  <section class="sheet"><h2>学習ポイント別（本人／全体）</h2>
    <div class="list">${s.points.map((x,i)=>`<div class="li"><span class="mk">${x.n?tagHtml(x.d):"—"}</span><div class="body"><b>${esc(plabel(x.code))}</b>
      <div class="kv"><span>正答率 <b>${x.n?pct(x.ac):"—"}</b> / ${pct(M.points[i].ac)}</span><span>時間 <b>${sec(x.tm)}</b> / ${sec(M.points[i].tm)}</span></div></div><span class="side">${x.n}問</span></div>`).join("")}</div></section>
  <section class="sheet"><h2>問題別の結果</h2>
    <div class="list">${qrows.map(x=>`<div class="li"><span class="mk" style="font-size:13px;font-family:var(--f-mono)">${esc(x.q.id.toUpperCase())}</span><div class="body"><span>${esc(x.q.stem)}</span></div><span class="side">誤答 ${x.miss}/${x.n}<br>${sec(x.tm)}</span></div>`).join("")}</div></section>`;
  $("#back").addEventListener("click",()=>{S.student=null;render()});
}
</script>
